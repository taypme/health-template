name: Add board and card kernels to template

on:
  push:
    paths:
      - .github/workflows/add-board-card-template.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update kernel system and README
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          kernel_path = Path('kernel.json')
          state_path = Path('kernel-state.json')
          readme_path = Path('README.md')

          kernel = json.loads(kernel_path.read_text())

          def ensure_kernel(name, schema=None):
              if not any(k['name'] == name for k in kernel['kernels']):
                  entry = {
                      'name': name,
                      'data_dir': f'kernels/{name}/data',
                      'index_path': f'kernels/{name}/index.json',
                      'pack_path': f'kernels/{name}/pack.json',
                  }
                  if schema:
                      entry['schema'] = schema
                  kernel['kernels'].append(entry)

          ensure_kernel('board', ['name', 'board_id'])
          ensure_kernel('card', ['board', 'board_id', 'list', 'list_id', 'name', 'card', 'card_id', 'description'])

          schemas = kernel.setdefault('kernel_schemas', {})
          schemas['board'] = {
              'fields': [
                  {'name': 'name', 'type': 'string'},
                  {'name': 'board_id', 'type': ['string', 'null']},
              ],
              'semantic': 'Board rows map a kernel board name to a stable external board identifier when the backing board system provides one.'
          }
          schemas['card'] = {
              'fields': [
                  {'name': 'board', 'type': 'string'},
                  {'name': 'board_id', 'type': ['string', 'null']},
                  {'name': 'list', 'type': 'string'},
                  {'name': 'list_id', 'type': ['string', 'null']},
                  {'name': 'name', 'type': 'string'},
                  {'name': 'card', 'type': 'string'},
                  {'name': 'card_id', 'type': ['string', 'null']},
                  {'name': 'description', 'type': 'string'},
              ],
              'semantic': 'Board/list card rows. name is a random UUID generated for the kernel row. Persist external board_id, list_id, and card_id whenever the backing board system provides them; card_id is the primary external deduplication key.'
          }

          commands = kernel.setdefault('kernel_commands', {})
          commands['board'] = [
              {
                  'machine': 'names',
                  'semantic': 'List out all board kernel row names, and lists of every board kernel row, in a compact table with board and list columns.'
              },
              {
                  'machine': 'pull',
                  'semantic': "Create new card kernel rows for external cards found in each committed board row, using the same identity and deduplication rules as card add. Read every external list and card from the backing board system, include description when present, persist stable board_id, list_id, and card_id values, and skip any external card whose non-empty card_id already exists in committed or pending card rows. Do not recreate external cards during pull."
              }
          ]
          commands['card'] = [
              {
                  'machine': 'add',
                  'semantic': "Use {{ argument 1 }} for the board field; it must reference a committed board kernel row. Use {{ argument 2 }} as the list field. Use {{ argument 3 }} as the card field and {{ argument 4 }} as the description field. Generate a random UUID for the kernel row name. Resolve the backing board system and persist every stable external identifier needed to prevent duplicate creation: store board_id for the external board when available, list_id for the external list when available, and card_id for the external card when available. Before creating anything externally, load committed and pending card rows and check external identifiers first. If the candidate external card already has a stable card ID and any committed or pending row has the same non-empty card_id, do not create another card and do not queue another row. When no external card ID exists yet because this command is creating a brand-new card, first resolve the referenced board and target list. If the list does not exist, create it once, capture and persist its returned list_id, then use that list. Create the external card exactly once, require a successful result, capture its returned card_id and any returned board_id/list_id, and only then queue the complete card kernel add row. Never synthesize external IDs. Never retry external creation after a successful create merely because kernel persistence fails. If external creation succeeds but the kernel mutation cannot be queued, report the created external card and its IDs so it can be reconciled without creating a duplicate. For systems that do not expose stable IDs, use the strongest available immutable external identifier and persist it in the corresponding *_id field; if no reliable identifier exists, report that create-only deduplication cannot be guaranteed and do not create the card."
              },
              {
                  'machine': 'data',
                  'semantic': 'Show a compact table of kernel rows, columns: list, card, description'
              }
          ]

          kernel_path.write_text(json.dumps(kernel, separators=(',', ':'), ensure_ascii=False) + '\n')

          for name in ('board', 'card'):
              d = Path('kernels') / name
              (d / 'data').mkdir(parents=True, exist_ok=True)
              (d / 'index.json').write_text('[]\n')
              (d / 'pack.json').write_text('[]\n')

          state = json.loads(state_path.read_text())
          for name in ('board', 'card'):
              state['kernels'][name] = {
                  'data_dir': f'kernels/{name}/data',
                  'index_path': f'kernels/{name}/index.json',
                  'pack_path': f'kernels/{name}/pack.json',
                  'count': 0,
                  'filenames': [],
              }

          readme = readme_path.read_text()
          readme = readme.replace('think\n```', 'think\nboard\ncard\n```')

          trello_section = '''\n## Trello Board And Card Integration\n\nThe template ships with empty `board` and `card` kernels. They are implemented through `kernel.json` and the normal kernel mutation system; they are not special-cased in `INSTRUCTIONS.md`.\n\nThese kernels can mirror and create Trello content when ChatGPT has access to the **Trello connector**. The connector is optional for the rest of Health Kernel, but it is required for commands that need to read from or write to Trello. Without a Trello connector, the board/card schemas still exist, but external board operations cannot be completed.\n\n### Board schema\n\n- `name`: kernel name for the board.\n- `board_id`: stable Trello board identifier when available.\n\n### Card schema\n\n- `board`: board kernel row name.\n- `board_id`: stable external board identifier.\n- `list`: Trello list name.\n- `list_id`: stable external list identifier.\n- `name`: random UUID used as the kernel row name.\n- `card`: card title.\n- `card_id`: stable external card identifier and primary deduplication key.\n- `description`: card description.\n\n### Commands\n\n- `$kernel board <name>`: uses normal kernel add fallback semantics to queue a board row. When using Trello, resolve and store the stable Trello board ID.\n- `$kernel board names`: show each committed board and its external lists in a compact `board` / `list` table.\n- `$kernel board pull`: read all lists and cards for committed board rows through Trello and queue only cards not already represented by their stable `card_id`. Pull imports existing Trello cards; it does **not** recreate them remotely.\n- `$kernel card add <board> <list> <card> <description>`: create one Trello card exactly once, creating the list first only when needed, capture the returned board/list/card IDs, generate a random UUID for the kernel row name, then queue the complete card row. Stable IDs are checked before creation to prevent duplicates.\n- `$kernel card data`: show committed cards in a compact table with `list`, `card`, and `description` columns.\n\nThe external IDs are important. `card_id` is the primary deduplication key, and the kernel must never invent Trello IDs or recreate a card merely because kernel persistence failed after Trello creation succeeded.\n'''

          marker = '\n## Local Maintenance\n'
          if '## Trello Board And Card Integration' not in readme:
              readme = readme.replace(marker, trello_section + marker)
          readme_path.write_text(readme)
          PY

          KERNEL_BLOB_SHA=$(git hash-object kernel.json)
          python3 - "$KERNEL_BLOB_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path('kernel-state.json')
          state = json.loads(p.read_text())
          state['registry_blob_sha'] = sys.argv[1]
          p.write_text(json.dumps(state, separators=(',', ':'), ensure_ascii=False) + '\n')
          PY

          rm .github/workflows/add-board-card-template.yml

      - name: Commit template update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernel.json kernel-state.json README.md kernels/board kernels/card .github/workflows/add-board-card-template.yml
          git commit -m "Ship board and card kernels with template"
          git push origin HEAD:main
