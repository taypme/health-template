name: Update board pull scope

on:
  push:
    paths:
      - .github/workflows/update-board-pull-scope.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update board pull command and README
        shell: bash
        run: |
          python3 <<'PY'
          import json, hashlib
          from pathlib import Path
          kp = Path('kernel.json')
          sp = Path('kernel-state.json')
          rp = Path('README.md')
          kernel = json.loads(kp.read_text())
          semantic = "Create new card kernel rows for external cards found in committed board rows, using the same identity and deduplication rules as card add. If {{ board }} (argument 1) is present, resolve it as an exact committed board row name and pull only that board; if no board argument is present, pull every committed board row. Read every external list and card from each selected board, include description when present, persist stable board_id, list_id, and card_id values, and skip any external card whose non-empty card_id already exists in committed or pending card rows. Do not recreate external cards during pull. If a supplied board name is not committed, report a concise error and queue nothing for that board."
          found = False
          for cmd in kernel.get('kernel_commands', {}).get('board', []):
              if cmd.get('machine') == 'pull':
                  cmd['semantic'] = semantic
                  found = True
          if not found:
              raise SystemExit('board pull command not found')
          kp.write_text(json.dumps(kernel, ensure_ascii=False, separators=(',', ':')) + '\n')
          state = json.loads(sp.read_text())
          data = kp.read_bytes()
          state['registry_blob_sha'] = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          sp.write_text(json.dumps(state, ensure_ascii=False, separators=(',', ':')) + '\n')
          readme = rp.read_text()
          old = '- `$kernel board pull`: read all lists and cards for committed board rows through Trello and queue only cards not already represented by their stable `card_id`. Pull imports existing Trello cards; it does **not** recreate them remotely.'
          new = '- `$kernel board pull [board]`: read lists and cards through Trello and queue only cards not already represented by their stable `card_id`. With no argument, pull every committed board row; when `board` is supplied, pull only that exact committed board. Pull imports existing Trello cards; it does **not** recreate them remotely.'
          if old in readme:
              readme = readme.replace(old, new)
          rp.write_text(readme)
          PY
          rm .github/workflows/update-board-pull-scope.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernel.json kernel-state.json README.md .github/workflows/update-board-pull-scope.yml
          git commit -m "Add board argument to board pull"
          git push origin HEAD:main
